<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="redGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="70%" stop-color="#d70015"/>
      <stop offset="100%" stop-color="#a0000a"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e61924"/>
      <stop offset="100%" stop-color="#b80008"/>
    </radialGradient>
    <clipPath id="chipClip">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base chip circle -->
    <circle cx="50" cy="50" r="48" fill="url(#redGrad)" stroke="#7a0005" stroke-width="1.5"/>

    <!-- White stripe edge tabs (6 outer blocks) -->
    <g clip-path="url(#chipClip)">
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(60 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(120 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(180 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(240 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(300 50 50)"/>
    </g>

    <!-- Outer rim inner groove -->
    <circle cx="50" cy="50" r="37" fill="none" stroke="#7a0005" stroke-width="2"/>
    <circle cx="50" cy="50" r="35" fill="url(#centerGrad)" stroke="#9e0007" stroke-width="1"/>

    <!-- Dashed inner ring -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 3.5"/>

    <!-- Center inner inlay -->
    <circle cx="50" cy="50" r="22" fill="url(#redGrad)" stroke="#800006" stroke-width="1"/>
  </g>
</svg>
