<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="blueGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="70%" stop-color="#0055d4"/>
      <stop offset="100%" stop-color="#003599"/>
    </radialGradient>
    <radialGradient id="blueCenterGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a88ff"/>
      <stop offset="100%" stop-color="#004cc2"/>
    </radialGradient>
    <clipPath id="chipClipBlue">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base chip circle -->
    <circle cx="50" cy="50" r="48" fill="url(#blueGrad)" stroke="#002266" stroke-width="1.5"/>

    <!-- White stripe edge tabs (6 outer blocks) -->
    <g clip-path="url(#chipClipBlue)">
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(60 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(120 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(180 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(240 50 50)"/>
      <path d="M 38 2 L 62 2 L 58 16 L 42 16 Z" fill="#f8f8f8" transform="rotate(300 50 50)"/>
    </g>

    <!-- Outer rim inner groove -->
    <circle cx="50" cy="50" r="37" fill="none" stroke="#002266" stroke-width="2"/>
    <circle cx="50" cy="50" r="35" fill="url(#blueCenterGrad)" stroke="#003399" stroke-width="1"/>

    <!-- Dashed inner ring -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 3.5"/>

    <!-- Center inner inlay -->
    <circle cx="50" cy="50" r="22" fill="url(#blueGrad)" stroke="#002266" stroke-width="1"/>
  </g>
</svg>
